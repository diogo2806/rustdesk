name: Apply issue 3762 branch patch

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3762-asio-multichannel
          fetch-depth: 0

      - name: Apply focused multichannel audio changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/server/audio_service.rs')
          text = path.read_text()

          replacements = []
          replacements.append((
              '    const AUDIO_PACKETS_PER_SECOND: usize = 100;\n',
              '    const AUDIO_PACKETS_PER_SECOND: usize = 100;\n    const MAX_CAPTURE_CHANNELS: u16 = 64;\n'
          ))
          replacements.append((
              '''    fn capture_packet_layout(sample_rate: u32, channels: u16) -> ResultType<(usize, usize)> {\n        if sample_rate < AUDIO_PACKETS_PER_SECOND as u32 || channels == 0 {\n            bail!("Invalid audio capture layout: sample_rate={sample_rate}, channels={channels}");\n        }\n        let frames = sample_rate as usize / AUDIO_PACKETS_PER_SECOND;\n''',
              '''    fn validate_capture_channels(channels: u16) -> ResultType<()> {\n        if channels == 0 {\n            bail!("Audio device reported zero channels");\n        }\n        if channels > MAX_CAPTURE_CHANNELS {\n            bail!(\n                "Audio device exposes unsupported channel count: {channels} (max {MAX_CAPTURE_CHANNELS})"\n            );\n        }\n        Ok(())\n    }\n\n    fn capture_packet_layout(sample_rate: u32, channels: u16) -> ResultType<(usize, usize)> {\n        validate_capture_channels(channels)?;\n        if sample_rate < AUDIO_PACKETS_PER_SECOND as u32 {\n            bail!("Invalid audio capture layout: sample_rate={sample_rate}, channels={channels}");\n        }\n        let frames = sample_rate as usize / AUDIO_PACKETS_PER_SECOND;\n'''
          ))
          replacements.append((
              '''        fn new(\n            config: CaptureFrameProcessorConfig,\n            sender: audio_capture_queue::CapturePcmSender,\n        ) -> ResultType<Self> {\n            let resampler = if config.input_rate == config.output_rate {\n''',
              '''        fn new(\n            config: CaptureFrameProcessorConfig,\n            sender: audio_capture_queue::CapturePcmSender,\n        ) -> ResultType<Self> {\n            validate_capture_channels(config.device_channel)?;\n            validate_capture_channels(config.encode_channel)?;\n            let resampler = if config.input_rate == config.output_rate {\n'''
          ))
          replacements.append((
              '''        let device_channel = config.channels();\n        let (_, capture_frame_samples) = capture_packet_layout(sample_rate_0, device_channel)?;\n''',
              '''        let device_channel = config.channels();\n        validate_capture_channels(device_channel)?;\n        let (_, capture_frame_samples) = capture_packet_layout(sample_rate_0, device_channel)?;\n'''
          ))
          replacements.append((
              '''        const STEREO_CHANNELS: u16 = 2;\n        const SURROUND_CHANNELS: u16 = 6;\n        const ZERO_CHANNELS: u16 = 0;\n''',
              '''        const STEREO_CHANNELS: u16 = 2;\n        const SURROUND_CHANNELS: u16 = 6;\n        const CHANNELS_8: u16 = 8;\n        const CHANNELS_16: u16 = 16;\n        const CHANNELS_32: u16 = 32;\n        const TOO_MANY_CHANNELS: u16 = 65;\n        const ZERO_CHANNELS: u16 = 0;\n'''
          ))
          replacements.append((
              '''            assert!(capture_packet_layout(INVALID_CAPTURE_RATE, MONO_CHANNELS).is_err());\n            assert!(capture_packet_layout(RATE_48_KHZ, ZERO_CHANNELS).is_err());\n        }\n''',
              '''            assert!(capture_packet_layout(INVALID_CAPTURE_RATE, MONO_CHANNELS).is_err());\n            assert!(capture_packet_layout(RATE_48_KHZ, ZERO_CHANNELS).is_err());\n            assert!(capture_packet_layout(RATE_48_KHZ, TOO_MANY_CHANNELS).is_err());\n            for channels in [SURROUND_CHANNELS, CHANNELS_8, CHANNELS_16, CHANNELS_32] {\n                assert_eq!(\n                    capture_packet_layout(RATE_48_KHZ, channels).unwrap(),\n                    (expected_frames, expected_frames * channels as usize)\n                );\n            }\n        }\n'''
          ))
          replacements.append((
              '''                (RATE_44_1_KHZ, RATE_24_KHZ, STEREO_CHANNELS, STEREO_CHANNELS),\n                (RATE_48_KHZ, RATE_48_KHZ, SURROUND_CHANNELS, STEREO_CHANNELS),\n            ] {\n''',
              '''                (RATE_44_1_KHZ, RATE_24_KHZ, STEREO_CHANNELS, STEREO_CHANNELS),\n                (RATE_48_KHZ, RATE_48_KHZ, SURROUND_CHANNELS, STEREO_CHANNELS),\n                (RATE_48_KHZ, RATE_48_KHZ, CHANNELS_8, STEREO_CHANNELS),\n                (RATE_48_KHZ, RATE_48_KHZ, CHANNELS_16, STEREO_CHANNELS),\n                (RATE_48_KHZ, RATE_48_KHZ, CHANNELS_32, STEREO_CHANNELS),\n            ] {\n'''
          ))

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source block not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Format and validate
        run: |
          rustfmt --edition 2021 src/server/audio_service.rs
          git diff --check

      - name: Commit to working branch
        run: |
          git config user.name "diogo2806"
          git config user.email "18616681+diogo2806@users.noreply.github.com"
          git add src/server/audio_service.rs
          git commit -m "fix(audio): harden multichannel capture for #3762" || exit 0
          git push origin HEAD:fix/3762-asio-multichannel
