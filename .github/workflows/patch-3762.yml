name: Patch issue 3762 audio pipeline

on:
  push:
    branches:
      - fix/3762-asio-multichannel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip patch-3762]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3762-asio-multichannel

      - name: Apply focused multichannel audio changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/server/audio_service.rs')
          text = path.read_text()

          old = '''    const AUDIO_PACKETS_PER_SECOND: usize = 100;\n'''
          new = '''    const AUDIO_PACKETS_PER_SECOND: usize = 100;\n    const MAX_CAPTURE_CHANNELS: u16 = 64;\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    fn capture_packet_layout(sample_rate: u32, channels: u16) -> ResultType<(usize, usize)> {\n        if sample_rate < AUDIO_PACKETS_PER_SECOND as u32 || channels == 0 {\n            bail!("Invalid audio capture layout: sample_rate={sample_rate}, channels={channels}");\n        }\n        let frames = sample_rate as usize / AUDIO_PACKETS_PER_SECOND;\n'''
          new = '''    fn validate_capture_channels(channels: u16) -> ResultType<()> {\n        if channels == 0 {\n            bail!("Audio device reported zero channels");\n        }\n        if channels > MAX_CAPTURE_CHANNELS {\n            bail!(\n                "Audio device exposes unsupported channel count: {channels} (max {MAX_CAPTURE_CHANNELS})"\n            );\n        }\n        Ok(())\n    }\n\n    fn capture_packet_layout(sample_rate: u32, channels: u16) -> ResultType<(usize, usize)> {\n        validate_capture_channels(channels)?;\n        if sample_rate < AUDIO_PACKETS_PER_SECOND as u32 {\n            bail!("Invalid audio capture layout: sample_rate={sample_rate}, channels={channels}");\n        }\n        let frames = sample_rate as usize / AUDIO_PACKETS_PER_SECOND;\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        fn new(\n            config: CaptureFrameProcessorConfig,\n            sender: audio_capture_queue::CapturePcmSender,\n        ) -> ResultType<Self> {\n            let resampler = if config.input_rate == config.output_rate {\n'''
          new = '''        fn new(\n            config: CaptureFrameProcessorConfig,\n            sender: audio_capture_queue::CapturePcmSender,\n        ) -> ResultType<Self> {\n            validate_capture_channels(config.device_channel)?;\n            validate_capture_channels(config.encode_channel)?;\n            let resampler = if config.input_rate == config.output_rate {\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        let device_channel = config.channels();\n        let (_, capture_frame_samples) = capture_packet_layout(sample_rate_0, device_channel)?;\n'''
          new = '''        let device_channel = config.channels();\n        validate_capture_channels(device_channel)?;\n        let (_, capture_frame_samples) = capture_packet_layout(sample_rate_0, device_channel)?;\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        const STEREO_CHANNELS: u16 = 2;\n        const SURROUND_CHANNELS: u16 = 6;\n        const ZERO_CHANNELS: u16 = 0;\n'''
          new = '''        const STEREO_CHANNELS: u16 = 2;\n        const SURROUND_CHANNELS: u16 = 6;\n        const CHANNELS_8: u16 = 8;\n        const CHANNELS_16: u16 = 16;\n        const CHANNELS_32: u16 = 32;\n        const TOO_MANY_CHANNELS: u16 = 65;\n        const ZERO_CHANNELS: u16 = 0;\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            assert!(capture_packet_layout(INVALID_CAPTURE_RATE, MONO_CHANNELS).is_err());\n            assert!(capture_packet_layout(RATE_48_KHZ, ZERO_CHANNELS).is_err());\n        }\n'''
          new = '''            assert!(capture_packet_layout(INVALID_CAPTURE_RATE, MONO_CHANNELS).is_err());\n            assert!(capture_packet_layout(RATE_48_KHZ, ZERO_CHANNELS).is_err());\n            assert!(capture_packet_layout(RATE_48_KHZ, TOO_MANY_CHANNELS).is_err());\n            for channels in [SURROUND_CHANNELS, CHANNELS_8, CHANNELS_16, CHANNELS_32] {\n                assert_eq!(\n                    capture_packet_layout(RATE_48_KHZ, channels).unwrap(),\n                    (expected_frames, expected_frames * channels as usize)\n                );\n            }\n        }\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                (RATE_44_KHZ, RATE_24_KHZ, STEREO_CHANNELS, STEREO_CHANNELS),\n                (RATE_48_KHZ, RATE_48_KHZ, SURROUND_CHANNELS, STEREO_CHANNELS),\n            ] {\n'''
          # Current constant is RATE_44_1_KHZ; keep replacement explicit below.
          if old not in text:
              old = '''                (RATE_44_1_KHZ, RATE_24_KHZ, STEREO_CHANNELS, STEREO_CHANNELS),\n                (RATE_48_KHZ, RATE_48_KHZ, SURROUND_CHANNELS, STEREO_CHANNELS),\n            ] {\n'''
          new = '''                (RATE_44_1_KHZ, RATE_24_KHZ, STEREO_CHANNELS, STEREO_CHANNELS),\n                (RATE_48_KHZ, RATE_48_KHZ, SURROUND_CHANNELS, STEREO_CHANNELS),\n                (RATE_48_KHZ, RATE_48_KHZ, CHANNELS_8, STEREO_CHANNELS),\n                (RATE_48_KHZ, RATE_48_KHZ, CHANNELS_16, STEREO_CHANNELS),\n                (RATE_48_KHZ, RATE_48_KHZ, CHANNELS_32, STEREO_CHANNELS),\n            ] {\n'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Validate focused diff
        run: |
          rustfmt --edition 2021 --check src/server/audio_service.rs
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "diogo2806"
          git config user.email "18616681+diogo2806@users.noreply.github.com"
          git add src/server/audio_service.rs
          git rm .github/workflows/patch-3762.yml
          git commit -m "fix(audio): harden multichannel capture for #3762 [skip patch-3762]"
          git push origin HEAD:fix/3762-asio-multichannel
